<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Değerlendirme Paneli — Fenomen Next</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://drive.google.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://bezwdlxombiirihxomnv.supabase.co">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --kagit:#FAF7F4; --kagit-2:#F1ECE7; --murekkep:#17130F; --murekkep-soft:#4A423B;
  --gri:#8C837B; --cizgi:#E2DAD2; --kirmizi:#FF0007; --yesil:#0F8A4F; --sari:#B57A00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--kagit);color:var(--murekkep);font-family:'Roboto',system-ui,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,.bslk{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
a{color:inherit}
.kap{max-width:1080px;margin:0 auto;padding:0 20px}
.gizli{display:none !important}

/* ---- üst bar ---- */
.bar{position:sticky;top:0;z-index:20;background:rgba(250,247,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--cizgi)}
.bar-ic{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.bar-ad{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em}
.bar-ad em{color:var(--kirmizi);font-style:normal}
.bar-sag{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rozet{font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:5px;background:var(--murekkep);color:#fff;white-space:nowrap}
.kim{font-size:13px;color:var(--gri)}

/* ---- sekmeler ---- */
.sekmeler{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);margin:22px 0 24px;flex-wrap:wrap}
.sekme{background:none;border:none;padding:11px 16px;font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gri);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sekme.aktif{color:var(--murekkep);border-bottom-color:var(--kirmizi)}

/* ---- düğmeler ---- */
.btn{font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:9px;border:1px solid var(--cizgi);background:#fff;color:var(--murekkep);cursor:pointer;transition:.18s}
.btn:hover{border-color:var(--murekkep)}
.btn:disabled{opacity:.45;cursor:default}
.btn-kirmizi{background:var(--kirmizi);border-color:var(--kirmizi);color:#fff}
.btn-koyu{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.btn-sm{padding:8px 13px;font-size:11px}

/* ---- giriş ---- */
.giris-sar{min-height:100vh;display:grid;place-items:center;padding:24px}
.giris{width:100%;max-width:380px;background:#fff;border:1px solid var(--cizgi);border-radius:18px;padding:34px 30px}
.giris h1{font-size:24px;margin-bottom:6px}
.giris p{color:var(--gri);font-size:14px;margin:0 0 24px}
label{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gri);margin-bottom:7px}
input[type=email],input[type=password],input[type=text],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--cizgi);border-radius:9px;
  background:var(--kagit);font-family:'Roboto',sans-serif;font-size:15px;color:var(--murekkep);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--murekkep)}
.alan{margin-bottom:16px}
.hata{color:var(--kirmizi);font-size:13.5px;margin-top:10px;display:none}
.hata.gorunur{display:block}

/* ---- süzgeç ---- */
.suzgec{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sz{background:#fff;border:1px solid var(--cizgi);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.sz.aktif{background:var(--murekkep);border-color:var(--murekkep);color:#fff}
.sz b{font-family:'Archivo',sans-serif;font-weight:800;margin-left:5px;opacity:.7}
.ara{margin-left:auto;max-width:220px}

/* ---- kart ---- */
.kart{background:#fff;border:1px solid var(--cizgi);border-radius:15px;padding:22px;margin-bottom:14px}
.kart-bas{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.no{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;color:var(--kirmizi);min-width:44px}
.kart-ad{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em}
.kart-alt{font-size:13px;color:var(--gri);margin-top:3px}
.kart-sag{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.durum{font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:5px 9px;border-radius:5px;border:1px solid var(--cizgi);color:var(--gri)}
.durum.gecti{background:var(--yesil);border-color:var(--yesil);color:#fff}
.durum.elendi{background:var(--kagit-2);color:var(--gri)}
.durum.kararsiz{border-color:var(--sari);color:var(--sari)}
.kart-govde{margin-top:18px;display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.etkt{font-family:'Archivo',sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gri);margin-bottom:6px}
.soru{margin-bottom:14px}
.soru p{margin:0;color:var(--murekkep-soft);font-size:14.5px;white-space:pre-wrap}
.video{width:100%;aspect-ratio:16/9;border:0;border-radius:11px;background:var(--kagit-2)}
.video-yok{aspect-ratio:16/9;border-radius:11px;background:var(--kagit-2);display:grid;place-items:center;text-align:center;padding:18px;color:var(--gri);font-size:13.5px}
.kart-ayak{margin-top:18px;padding-top:16px;border-top:1px solid var(--cizgi);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.onay-iz{font-size:12px;color:var(--gri);margin-left:auto}
.onay-iz span{margin-left:9px}
.onay-iz .var{color:var(--yesil)}

/* ---- puanlama ---- */
.puan-izgara{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin-bottom:14px}
.puan-satir{display:flex;align-items:center;gap:11px}
.puan-ad{font-size:13.5px;color:var(--murekkep-soft);flex:1}
.puan-tus{display:flex;gap:3px}
.pt{width:25px;height:25px;border:1px solid var(--cizgi);background:#fff;border-radius:6px;font-size:11.5px;cursor:pointer;padding:0;color:var(--gri);font-family:'Archivo',sans-serif;font-weight:700}
.pt.secili{background:var(--kirmizi);border-color:var(--kirmizi);color:#fff}
.puan-ort{font-family:'Archivo',sans-serif;font-weight:800;font-size:26px}
.puan-ort small{font-size:12px;color:var(--gri);font-weight:400;font-family:'Roboto',sans-serif}

/* ---- tablo ---- */
.tablo-sar{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--cizgi)}
th{font-family:'Archivo',sans-serif;font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gri)}
td.sayi,th.sayi{text-align:right;font-variant-numeric:tabular-nums}

.bos{text-align:center;padding:60px 20px;color:var(--gri)}
.yukleniyor{text-align:center;padding:50px;color:var(--gri)}
.uyari{background:var(--kagit-2);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--murekkep-soft);margin-bottom:18px}
.sifre-kutu{background:var(--murekkep);color:#fff;border-radius:11px;padding:16px 18px;margin-top:14px;font-family:'Archivo',sans-serif;font-weight:700;word-break:break-all}
.sifre-kutu small{display:block;font-family:'Roboto',sans-serif;font-weight:400;font-size:12.5px;opacity:.7;margin-bottom:6px}

@media (max-width:820px){
  .kart-govde{grid-template-columns:1fr}
  .puan-izgara{grid-template-columns:1fr}
  .ara{margin-left:0;max-width:none;width:100%}
}
</style>
</head>
<body>

<!-- ================= GİRİŞ ================= -->
<div class="giris-sar" id="girisEkran">
  <form class="giris" id="girisForm">
    <h1>Değerlendirme paneli</h1>
    <p>Fenomen Next başvuru değerlendirmesi</p>
    <div class="alan">
      <label for="eposta">E-posta</label>
      <input type="email" id="eposta" autocomplete="username" required>
    </div>
    <div class="alan">
      <label for="sifre">Şifre</label>
      <input type="password" id="sifre" autocomplete="current-password" required>
    </div>
    <button class="btn btn-kirmizi" style="width:100%" id="girisBtn">Giriş yap</button>
    <div class="hata" id="girisHata"></div>
  </form>
</div>

<!-- ================= PANEL ================= -->
<div class="gizli" id="panel">
  <div class="bar"><div class="kap bar-ic">
    <div class="bar-ad">FENOMEN <em>NEXT</em></div>
    <span class="rozet" id="rolRozet">—</span>
    <div class="bar-sag">
      <span class="kim" id="kimYazi"></span>
      <button class="btn btn-sm" id="cikisBtn">Çıkış</button>
    </div>
  </div></div>

  <div class="kap">
    <div class="sekmeler" id="sekmeler"></div>
    <div id="icerik"><div class="yukleniyor">Yükleniyor…</div></div>
  </div>
</div>

<script src="js/panel.js?v=c3ea206852"></script>
</body>
</html>
